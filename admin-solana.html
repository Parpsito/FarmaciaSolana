<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Farmacia Solana</title><style>
:root{--bg:#faf7f4;--tx:#201c1b;--ln:#ddd4cc;--acc:#7c2a46;--ok:#187744;--err:#b32d32}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:900px;margin:auto;font:16px system-ui;background:var(--bg);color:var(--tx)}h1{font-size:1.4rem}input,button{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}button{cursor:pointer}.primary{background:var(--acc);color:white;border-color:var(--acc)}.wide{width:100%}.row{display:grid;grid-template-columns:minmax(180px,1fr) 130px 130px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.row small{opacity:.65;display:block}.row input{width:100%}.sticky{position:sticky;bottom:0;padding:12px 0;background:var(--bg)}.msg{min-height:1.4em}@media(max-width:600px){.row{grid-template-columns:1fr 105px 105px}.row label{font-size:.9rem}}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.order{border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0;background:white}.order h3{margin:0 0 8px}.order details{margin-top:10px}.order ul{padding-left:20px}.tag{display:inline-block;border-radius:999px;padding:3px 9px;background:#eee;font-size:.85em}.tag.paid{background:#d8f3e3;color:#145d37}.tag.pending{background:#fff0c2;color:#735300}.tag.cancelled{background:#f7dada;color:#8b2424}.order button{margin-top:8px}@media(max-width:600px){.toolbar{align-items:flex-start;flex-direction:column}} </style><body><h1>Administración · Farmacia Solana</h1><section id="login"><p>Contraseña de administración</p><input id="pw" type="password" class="wide" autocomplete="current-password"><p><label><input type="checkbox" id="show"> Mostrar contraseña</label></p><button id="loginBtn" class="primary wide">Entrar</button><div id="m1" class="msg"></div></section><main id="app" hidden><nav class="tabs"><button id="tabStock" class="primary">Precios y stock</button><button id="tabOrders">Pedidos</button></nav><section id="stockPanel"><p>Ingresá precio en pesos y stock. Dejar stock vacío significa sin límite; 0 significa agotado. Precio vacío deshabilita el cobro por Mercado Pago de ese producto.</p><div id="list"></div><div class="sticky"><div id="m2" class="msg"></div><button id="save" class="primary wide">Guardar precios y stock</button></div></section><section id="ordersPanel" hidden><div class="toolbar"><button id="refreshOrders">Actualizar pedidos</button><span id="orderMsg" class="msg"></span></div><div id="ordersList"></div></section></main><script>
const API='/.netlify/functions/admin-solana', $=x=>document.getElementById(x);let pw=sessionStorage.getItem('solanaAdmin')||'',D=null;
async function call(body){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw},body:JSON.stringify({...body,password:pw})})}
async function enter(){pw=$('pw').value||pw;if(!pw){$('m1').textContent='Ingresá la contraseña';return}$('m1').textContent='Verificando…';try{let r=await call({check:true});let msg='';try{msg=(await r.json()).error||''}catch{}if(!r.ok){$('m1').textContent='Error '+r.status+(msg?': '+msg:': la función rechazó la solicitud');return}sessionStorage.setItem('solanaAdmin',pw);let g=await call({load:true});if(!g.ok){$('m1').textContent='Contraseña aceptada, pero GET falló ('+g.status+')';return}D=await g.json();$('login').hidden=true;$('app').hidden=false;paint()}catch(e){$('m1').textContent='Error de red/función: '+(e.message||e)}}
function paint(){$('list').innerHTML=D.productos.map(p=>{let pr=D.precios[p.id]??'',st=D.stock[p.id]??'';return `<div class="row" data-id="${p.id}"><b>${esc(p.nombre)}<small>${esc(p.marca)}</small></b><label>Precio ($)<input type="number" min="0" step="1" inputmode="numeric" value="${pr}" data-price></label><label>Stock<input type="number" min="0" step="1" inputmode="numeric" value="${st}" placeholder="Sin límite" data-stock></label></div>`}).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('save').onclick=async()=>{let precios={},stock={};document.querySelectorAll('.row').forEach(r=>{let id=r.dataset.id,p=r.querySelector('[data-price]').value,s=r.querySelector('[data-stock]').value;precios[id]=p===''?null:Number(p);stock[id]=s===''?null:Number(s)});$('m2').textContent='Guardando…';try{let r=await call({precios,stock});if(!r.ok){$('m2').textContent=(await r.json()).error||'Error';return}D.precios=precios;D.stock=stock;$('m2').textContent='✓ Guardado';$('m2').style.color='var(--ok)'}catch(e){$('m2').textContent='Error de conexión'}};
function fmt(n){return Number(n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0})}
async function loadOrders(){ $('orderMsg').textContent='Cargando…';try{let r=await call({orders:true});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');renderOrders(j.orders||[]);$('orderMsg').textContent=(j.orders||[]).length+' pedidos'}catch(e){$('orderMsg').textContent=e.message}}
function renderOrders(orders){$('ordersList').innerHTML=orders.length?orders.map(o=>{let status=o.status||'pending',label=status==='paid'?'Pagado':status==='cancelled'?'Cancelado':status==='whatsapp'?'WhatsApp':'Checkout iniciado';let date=o.createdAt?new Date(o.createdAt).toLocaleString('es-AR'):'—';return `<article class="order"><h3>${esc(o.name||'Cliente')} <span class="tag ${esc(status)}">${esc(label)}</span></h3><div><b>${esc(o.id||'')}</b> · ${esc(o.method||'')} · ${esc(date)}</div><div>${esc(o.delivery==='envio'?'Envío':'Retiro')}${o.address?' · '+esc(o.address):''}</div>${o.phone?'Teléfono: '+esc(o.phone):''}${o.note?'<p>Nota: '+esc(o.note)+'</p>':''}<details><summary>Productos y total</summary><ul>${(o.items||[]).map(i=>`<li>${esc(i.quantity)} × ${esc(i.brand||'')} ${esc(i.name||'')} — ${i.unitPrice!=null?fmt(i.unitPrice)+' c/u':'Precio pendiente'}</li>`).join('')}</ul><b>Total: ${fmt(o.total)}</b></details>${(status==='pending'||status==='whatsapp')?`<button class="primary" data-paid="${esc(o.id)}">Marcar como pagado</button>`:''}${status!=='cancelled'&&status!=='paid'?`<button data-cancel="${esc(o.id)}">Cancelar pedido y restaurar stock</button>`:''}${o.manualPaidAt?'<p><small>Confirmado manualmente el '+esc(new Date(o.manualPaidAt).toLocaleString('es-AR'))+'</small></p>':''}</article>`}).join(''):'<p>No hay pedidos registrados todavía.</p>';document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Confirmar que este pedido fue pagado?'))return;b.disabled=true;try{let r=await call({markPaid:b.dataset.paid});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');renderOrders(j.orders||[])}catch(e){alert(e.message);b.disabled=false}});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Cancelar este pedido y restaurar el stock si corresponde?'))return;b.disabled=true;try{let r=await call({cancelOrder:b.dataset.cancel});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');renderOrders(j.orders||[])}catch(e){alert(e.message);b.disabled=false}})}
$('tabStock').onclick=()=>{$('stockPanel').hidden=false;$('ordersPanel').hidden=true;$('tabStock').className='primary';$('tabOrders').className=''};
$('tabOrders').onclick=()=>{$('stockPanel').hidden=true;$('ordersPanel').hidden=false;$('tabStock').className='';$('tabOrders').className='primary';loadOrders()};$('refreshOrders').onclick=loadOrders;
$('show').onchange=()=> $('pw').type=$('show').checked?'text':'password';$('loginBtn').onclick=enter;$('pw').onkeydown=e=>{if(e.key==='Enter')enter()};if(pw){$('pw').value=pw;enter()}
</script></body></html>
